<!-- Este fragmento es solo referencia: el HTML ya está copiado dentro de cada página -->
<button id="chat-boton" aria-label="Abrir chat de EcoBarrio Creativo">💬</button>
<div id="chat-panel" class="chat-panel" role="dialog" aria-label="Chat con EcoBarrio Creativo">
  <div class="chat-cabecera">
    <strong>Asistente EcoBarrio</strong>
    <button id="chat-cerrar" aria-label="Cerrar chat">✕</button>
  </div>
  <div id="chat-mensajes" class="chat-mensajes">
    <div class="chat-burbuja bot">¡Hola! 🌱 Pregúntame sobre nuestras jornadas de limpieza, talleres de reciclaje o cómo unirte al barrio.</div>
  </div>
  <form id="chat-form" class="chat-form">
    <input id="chat-input" type="text" placeholder="Escribe tu pregunta..." autocomplete="off" required />
    <button type="submit" aria-label="Enviar">➤</button>
  </form>
</div>
